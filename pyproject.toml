[project]
name = "windmojo"
version = "0.2.0"
description = "ML-powered wind forecasting for any location worldwide"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Windmojo Contributors"}
]
keywords = [
    "wind forecasting",
    "machine learning",
    "weather prediction",
    "wind sports",
    "kitesurfing",
    "windsurfing",
    "XGBoost",
    "meteorology"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",  # For parquet support
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",  # For loading API keys from .env
    "click>=8.1.0",  # CLI framework
    "seaborn>=0.12.0",  # Statistical data visualization
    "scipy>=1.10.0",  # Scientific computing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",  # Parallel testing
    "black==24.4.2",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]

analysis = [
    "shap>=0.44.0",  # SHAP values for feature importance
]

docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

all = [
    "windmojo[dev,notebooks,analysis,docs]",
]

[project.urls]
Homepage = "https://github.com/marioland/windmojo"
Documentation = "https://github.com/marioland/windmojo#readme"
Repository = "https://github.com/marioland/windmojo"
Issues = "https://github.com/marioland/windmojo/issues"

[project.scripts]
windmojo = "windmojo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "sklearn.*",
    "matplotlib.*",
]
ignore_missing_imports = true
