<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind forecast</title>
<!--
  Windmojo forecast page. Displays the JSON written by `python cli.py predict`.
  Self-contained: no external scripts, fonts or CDNs (no visitor data to third parties).
  Setup and embedding: see DEPLOYMENT.md, section "Website Integration".
  Served by `python cli.py serve`, the page also offers an update button, the past days
  (forecast against measurements) and CSV downloads; as a static file these are hidden.
-->
<style>
  .windmojo {
    --bg: #ffffff; --fg: #1d2430; --muted: #5f6b7a; --line: #e3e7ec; --panel: #f5f7f9; --shade: #eef1f4;
    --model: #0b6bcb; --openmeteo: #c77a22; --gust: #9aa5b1; --measured: #1f8f4e;
    --warn-bg: #fff4e5; --warn-fg: #8a4b00;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
    max-width: 1280px; margin: 0 auto; padding: 16px 20px;
  }
  @media (prefers-color-scheme: dark) {
    .windmojo {
      --bg: #12161c; --fg: #e6e9ee; --muted: #9aa5b1; --line: #2a313b; --panel: #1a2029; --shade: #1c232d;
      --model: #5aa9ff; --openmeteo: #e8a25a; --gust: #6b7682; --measured: #4cd38a;
      --warn-bg: #3a2a12; --warn-fg: #ffcf8a;
    }
  }
  body { margin: 0; background: #ffffff; }
  @media (prefers-color-scheme: dark) { body { background: #12161c; } }

  /* Header: what the project is about, at a glance (made for a landscape screenshot) */
  .windmojo .hero {
    border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px 16px; margin-bottom: 18px;
    background: linear-gradient(180deg, var(--panel) 0, var(--bg) 150px);
  }
  .windmojo .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 32px; }
  .windmojo .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .windmojo .brand svg { flex: none; }
  .windmojo .hero h1 { font-size: 2.1rem; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  .windmojo .hero h1 span { color: var(--muted); font-weight: 500; }
  .windmojo .tagline { color: var(--muted); font-size: 1.08rem; line-height: 1.5; margin: 0; max-width: 660px; }
  .windmojo .tagline strong { color: var(--fg); font-weight: 600; }
  .windmojo .score {
    flex: none; width: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px 10px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
  }
  .windmojo .score-big { display: flex; align-items: center; gap: 12px; }
  .windmojo .score-big b { font-size: 2.9rem; line-height: 1; color: var(--model); letter-spacing: -.03em; }
  .windmojo .score-big span { font-size: .95rem; line-height: 1.3; }
  .windmojo .bars {
    margin: 10px 0 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px;
    align-items: center; font-size: .82rem;
  }
  .windmojo .bars .track { height: 10px; background: var(--shade); border-radius: 5px; overflow: hidden; }
  .windmojo .bars .track i { display: block; height: 100%; border-radius: 5px; }
  .windmojo .bars .val { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  .windmojo .score small { display: block; color: var(--muted); font-size: .75rem; }
  .windmojo .hero .chart { margin: 16px 0 12px; }
  .windmojo .hero .chart svg { min-width: 760px; }
  .windmojo .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .windmojo .source { background: var(--panel); border-radius: 10px; padding: 10px 14px 12px; }
  .windmojo .source h3 { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin: 0 0 3px; }
  .windmojo .source h3 svg { flex: none; }
  .windmojo .source p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.45; }
  .windmojo .footnote { margin: 12px 2px 0; color: var(--muted); font-size: .76rem; line-height: 1.5; }
  .windmojo .footnote a { color: inherit; }
  @media (max-width: 800px) {
    .windmojo .hero { padding: 16px 16px 12px; }
    .windmojo .hero-top { flex-direction: column; align-items: stretch; gap: 14px; }
    .windmojo .score { width: auto; }
  }

  .windmojo h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .windmojo .meta { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .windmojo .warn { background: var(--warn-bg); color: var(--warn-fg); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .windmojo .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .windmojo button {
    font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--fg); cursor: pointer;
  }
  .windmojo button[aria-pressed="true"], .windmojo button.primary { background: var(--model); border-color: var(--model); color: #fff; }
  .windmojo button:disabled { opacity: .6; cursor: progress; }
  .windmojo .toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; font-size: .9rem; }
  .windmojo .toolbar a { color: var(--model); }
  .windmojo .muted { color: var(--muted); }
  .windmojo .summary { background: var(--panel); padding: 8px 12px; border-radius: 6px; margin: 0 0 12px; }
  .windmojo .summary ul { margin: 2px 0 0; padding-left: 18px; }
  .windmojo .summary .good { color: var(--measured); font-weight: 600; }
  .windmojo .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--muted); margin: 4px 0 8px; }
  .windmojo .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .windmojo .chart { overflow-x: auto; }
  .windmojo .chart svg { width: 100%; min-width: 640px; height: auto; display: block; }
  .windmojo .day { margin-top: 18px; }
  .windmojo .history { margin-top: 28px; }
  .windmojo .history > h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .windmojo .history section { margin-top: 16px; }
  .windmojo .history h3 { font-size: 1.05rem; margin: 0 0 6px; }
  .windmojo .scroll { overflow-x: auto; }
  .windmojo table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .windmojo th, .windmojo td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .windmojo th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  .windmojo td.hour, .windmojo th.hour { text-align: left; }
  .windmojo td.bar { width: 40%; text-align: left; }
  .windmojo .bar span { display: inline-block; height: 10px; border-radius: 3px; background: var(--model); vertical-align: middle; }
  .windmojo td.measured { color: var(--measured); font-weight: 600; }
  .windmojo .arrow { display: inline-block; width: 1em; text-align: center; }
  .windmojo tr.past { opacity: .45; }
  .windmojo tr.past.has-measured { opacity: 1; }
  @media (max-width: 600px) {
    .windmojo .bar { display: none; }
    .windmojo th, .windmojo td { padding: 3px 4px; }
  }
  .windmojo footer { margin-top: 20px; color: var(--muted); font-size: .8rem; }
  .windmojo footer a { color: inherit; }
</style>
</head>
<body>

<!-- Embed: copy this div, the <style> block and the <script> block into your page.
     data-src: URL of the forecast JSON (relative to the page or absolute). -->
<div class="windmojo" id="windmojo" data-src="greifensee.json">
  <p>Loading forecast …</p>
</div>

<script>
(function () {
  "use strict";

  var root = document.getElementById("windmojo");
  var STALE_HOURS = 12;   // Warn when the forecast is older (not updated?)
  var HISTORY_DAYS = 7;   // Past days shown when served by `cli.py serve`
  var HERO_PAST_DAYS = 3; // Past days in the header chart
  // Overview: hours with Windmojo mean wind in this range (knots), daytime only
  var SESSION = { name: "Wingfoiling", minKn: 10, maxKn: 15, fromHour: 8, toHour: 20 };
  var KN = 1.943844;
  var UNITS = {
    "m/s": { factor: 1, digits: 1 },
    "kn": { factor: KN, digits: 0 },
    "km/h": { factor: 3.6, digits: 0 }
  };
  var SERIES = [
    { key: "openmeteo_gusts", color: "var(--gust)", dash: "2 3", width: 1.5, label: "Gusts (weather model)" },
    { key: "openmeteo_wind_speed", color: "var(--openmeteo)", dash: "6 4", width: 1.8, label: "Weather model (Open-Meteo)" },
    { key: "wind_speed", color: "var(--model)", dash: "", width: 2.6, label: "Windmojo (spot forecast)" },
    { key: "hindcast_speed", color: "var(--model)", dash: "2 4", width: 2, label: "Windmojo hindcast (weather data of the day)" },
    { key: "measured_speed", color: "var(--measured)", dash: "", width: 2.2, label: "Measured" }
  ];
  var HERO = {
    openmeteo: { key: "openmeteo_wind_speed", color: "var(--openmeteo)", dash: "7 5", width: 2.4, label: "Weather model" },
    model: { key: "model", color: "var(--model)", dash: "", width: 3.2, label: "Windmojo" },
    measured: { key: "measured_speed", color: "var(--measured)", dash: "", width: 3, label: "Measured" }
  };
  var LOGO = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--model)" stroke-width="2.2" ' +
    'stroke-linecap="round" aria-hidden="true"><path d="M3 8.5h10.5a3 3 0 1 0-3-3"/>' +
    '<path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 16.5h6.5"/></svg>';
  var WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var unit = "m/s";
  var data = null;
  var local = null;       // Status of `cli.py serve`, null for a static page
  var past = [];          // Past days (local only)
  var busy = false;
  var messages = [];

  try { unit = localStorage.getItem("windmojo-unit") || unit; } catch (e) {}
  // URL parameters: ?unit=kn (overrides the stored unit), ?view=header (only the header, e.g. for screenshots)
  var params = new URLSearchParams(typeof location !== "undefined" ? location.search : "");
  if (UNITS[params.get("unit")]) unit = params.get("unit");
  if (!UNITS[unit]) unit = "m/s";
  var headerOnly = params.get("view") === "header";

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function isNum(v) { return v !== null && v !== undefined; }

  // Times are local to the spot ("YYYY-MM-DDTHH:MM"); parse without the
  // browser's time zone so visitors abroad see the spot's local time.
  function parts(t) {
    return { date: t.slice(0, 10), hour: parseInt(t.slice(11, 13), 10) };
  }

  function dayLabel(date) {
    var y = +date.slice(0, 4), m = +date.slice(5, 7), d = +date.slice(8, 10);
    var wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return WEEKDAYS[wd] + " " + d + " " + MONTHS[m - 1];
  }

  function timeLabel(t) {
    return dayLabel(t.slice(0, 10)) + " " + t.slice(11, 16);
  }

  function created(iso) {
    return new Date(iso).toLocaleString("en-GB", {
      timeZone: data.timezone, weekday: "short", day: "numeric", month: "short",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function fmt(v) {
    if (!isNum(v)) return "–";
    var u = UNITS[unit];
    return (v * u.factor).toFixed(u.digits);
  }

  // Wind direction is where the wind comes from; the arrow points where it blows to
  function arrow(deg) {
    if (!isNum(deg)) return "";
    return '<span class="arrow" title="from ' + deg + '°" style="transform:rotate(' +
      (deg + 180) + 'deg)">↑</span>';
  }

  // Local "now" at the spot, as "YYYY-MM-DDTHH:MM" (for greying out past hours)
  function spotNow(tz) {
    try {
      var p = {};
      new Intl.DateTimeFormat("en-CA", {
        timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      return p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":" + p.minute;
    } catch (e) {
      return "";
    }
  }

  function groupByDay(hours) {
    var days = [];
    hours.forEach(function (h) {
      var d = parts(h.time).date;
      if (!days.length || days[days.length - 1].date !== d) days.push({ date: d, hours: [] });
      days[days.length - 1].hours.push(h);
    });
    return days;
  }

  function present(hours, key) {
    return hours.some(function (h) { return isNum(h[key]); });
  }

  function legend(hours) {
    return '<div class="legend">' + SERIES.filter(function (s) { return present(hours, s.key); })
      .map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + "</span>";
      }).join("") + "</div>";
  }

  // Line chart over days (nights are not forecast: a gap between days)
  function chart(days) {
    var W = 1240, H = 260, L = 34, R = 8, T = 10, B = 34;
    var n = 0;
    days.forEach(function (d) { n += d.hours.length; });
    if (!n) return "";
    var gap = 4;
    var slots = n + gap * (days.length - 1);
    var max = 0;
    days.forEach(function (d) {
      d.hours.forEach(function (h) {
        SERIES.forEach(function (s) { max = Math.max(max, h[s.key] || 0); });
      });
    });
    var u = UNITS[unit];
    var top = Math.max(5, Math.ceil(max * u.factor / 5) * 5);
    var step = top <= 10 ? 2 : top <= 25 ? 5 : 10;
    function x(i) { return L + (i + 0.5) * (W - L - R) / slots; }
    function y(v) { return T + (1 - v * u.factor / top) * (H - T - B); }

    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Wind forecast chart">';
    for (var g = 0; g <= top; g += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g / u.factor) + '" y2="' + y(g / u.factor) +
        '" stroke="var(--line)"/>';
      svg += '<text x="' + (L - 6) + '" y="' + (y(g / u.factor) + 4) +
        '" text-anchor="end" font-size="11" fill="var(--muted)">' + g + "</text>";
    }

    var i = 0;
    days.forEach(function (d) {
      var start = i;
      SERIES.forEach(function (s) {
        var pts = [];
        d.hours.forEach(function (h, k) {
          if (isNum(h[s.key])) pts.push(x(start + k).toFixed(1) + "," + y(h[s.key]).toFixed(1));
        });
        if (pts.length) {
          svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + s.width + '"' +
            (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") + ' points="' + pts.join(" ") + '"/>';
        }
      });
      var mid = (x(start) + x(start + d.hours.length - 1)) / 2;
      svg += '<text x="' + mid + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="var(--muted)">' +
        dayLabel(d.date) + "</text>";
      i += d.hours.length + gap;
    });
    return svg + "</svg>";
  }

  function table(day, now) {
    var scale = 0;
    var measured = present(day.hours, "measured_speed");
    var hindcast = present(day.hours, "hindcast_speed");
    day.hours.forEach(function (h) { scale = Math.max(scale, h.wind_speed || 0); });
    var rows = day.hours.map(function (h) {
      var isPast = now && h.time.slice(0, 13) < now.slice(0, 13);
      var w = scale ? Math.round(100 * (h.wind_speed || 0) / Math.max(scale, 8)) : 0;
      return '<tr class="' + (isPast ? "past" : "") + (isNum(h.measured_speed) ? " has-measured" : "") + '">' +
        '<td class="hour">' + String(parts(h.time).hour).padStart(2, "0") + ":00</td>" +
        "<td>" + arrow(h.wind_direction) + "</td>" +
        "<td><strong>" + fmt(h.wind_speed) + "</strong></td>" +
        '<td class="bar"><span style="width:' + w + '%"></span></td>' +
        (hindcast ? "<td>" + fmt(h.hindcast_speed) + "</td>" : "") +
        "<td>" + fmt(h.openmeteo_wind_speed) + "</td>" +
        "<td>" + fmt(h.openmeteo_gusts) + "</td>" +
        (measured ? '<td class="measured">' + fmt(h.measured_speed) + "</td><td>" + fmt(h.measured_gust) +
          "</td><td>" + arrow(h.measured_direction) + "</td>" : "") + "</tr>";
    }).join("");
    return '<div class="scroll"><table>' +
      '<thead><tr><th class="hour">Time</th><th>Direction</th><th>Windmojo</th><th class="bar"></th>' +
      (hindcast ? "<th>Hindcast</th>" : "") +
      "<th>Weather model</th><th>Gusts</th>" +
      (measured ? "<th>Measured</th><th>Measured gusts</th><th>Measured direction</th>" : "") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  // Mean absolute error of a Windmojo forecast and of the weather model against the
  // measurement, on the same hours (all three present)
  function compare(hours, key) {
    var model = 0, om = 0, n = 0;
    hours.forEach(function (h) {
      if (isNum(h[key]) && isNum(h.openmeteo_wind_speed) && isNum(h.measured_speed)) {
        model += Math.abs(h[key] - h.measured_speed);
        om += Math.abs(h.openmeteo_wind_speed - h.measured_speed);
        n++;
      }
    });
    return n ? { model: model / n, om: om / n, n: n, pct: Math.round(100 * (1 - model / om)) } : null;
  }

  // "42 % more accurate than the weather model (mean error 0.5 instead of 0.8 m/s, 18 h)"
  function better(c) {
    return "<strong>" + Math.abs(c.pct) + " % " + (c.pct >= 0 ? "more" : "less") + " accurate</strong> " +
      "than the weather model (mean error " + fmt(c.model) + " instead of " + fmt(c.om) + " " + esc(unit) +
      ", " + c.n + " h)";
  }

  // Header chart: past days the model was not trained on (forecast as shown then,
  // else hindcast), then today and the forecast days
  function heroDays(days, today) {
    var result = [];
    past.filter(function (d) { return d.date < today; }).forEach(function (d) {
      var hours = d.hours.map(function (h) {
        var model = isNum(h.wind_speed) ? h.wind_speed : (d.hindcast_in_training ? null : h.hindcast_speed);
        return { time: h.time, model: isNum(model) ? model : null,
          openmeteo_wind_speed: h.openmeteo_wind_speed, measured_speed: h.measured_speed };
      });
      if (present(hours, "model") && present(hours, "measured_speed")) result.push({ date: d.date, hours: hours });
    });
    result = result.slice(-HERO_PAST_DAYS);
    days.forEach(function (d) {
      result.push({ date: d.date, hours: d.hours.map(function (h) {
        return { time: h.time, model: h.wind_speed, openmeteo_wind_speed: h.openmeteo_wind_speed,
          measured_speed: isNum(h.measured_speed) ? h.measured_speed : null };
      }) });
    });
    return result;
  }

  function shortDate(date) {
    return +date.slice(8, 10) + " " + MONTHS[+date.slice(5, 7) - 1];
  }

  // "28–31 Oct", "30 Oct – 2 Nov" or "31 Oct"
  function dateRange(first, last) {
    if (first === last) return shortDate(first);
    if (first.slice(0, 7) === last.slice(0, 7)) return +first.slice(8, 10) + "–" + shortDate(last);
    return shortDate(first) + " – " + shortDate(last);
  }

  function lineSample(s) {
    return '<svg width="28" height="10" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" stroke="' + s.color +
      '" stroke-width="3.2" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="5 5"' : "") + "/></svg>";
  }

  // Header chart: lines labelled directly, past region shaded, hour ticks per day
  function heroChart(days, now, caption) {
    var W = 1240, H = 360, L = 44, R = 124, T = 58, B = 50;
    var series = [HERO.openmeteo, HERO.model, HERO.measured];
    var gap = 3, n = 0, max = 0;
    days.forEach(function (d) {
      n += d.hours.length;
      d.hours.forEach(function (h) { series.forEach(function (s) { max = Math.max(max, h[s.key] || 0); }); });
    });
    if (!n) return "";
    var slots = n + gap * (days.length - 1), cw = (W - L - R) / slots;
    var u = UNITS[unit];
    var raw = max * u.factor;
    var step = raw <= 10 ? 2 : raw <= 25 ? 5 : 10;
    var top = Math.max(2 * step, Math.ceil(raw / step) * step);
    function x(i) { return L + (i + 0.5) * cw; }
    function y(v) { return T + (1 - v * u.factor / top) * (H - T - B); }
    function text(tx, ty, str, attrs) {
      return '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" ' + attrs + ">" + str + "</text>";
    }

    var points = [], i = 0, nowX = null;
    days.forEach(function (d) {
      d.hours.forEach(function (h, k) {
        points.push({ h: h, x: x(i + k) });
        if (nowX === null && h.time.slice(0, 13) >= now.slice(0, 13)) nowX = x(i + k) - cw / 2;
      });
      d.mid = (x(i) + x(i + d.hours.length - 1)) / 2;
      i += d.hours.length + gap;
    });
    if (nowX === null) nowX = W - R;

    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Measured wind, weather model and Windmojo forecast">';
    var caps = 'font-size="11.5" font-weight="600" letter-spacing=".08em" fill="var(--muted)"';
    if (nowX > L) {
      svg += '<rect x="' + L + '" y="' + T + '" width="' + (nowX - L).toFixed(1) + '" height="' + (H - T - B) +
        '" rx="6" fill="var(--shade)"/>';
      svg += text(L + 10, 16, esc(caption.toUpperCase()), caps);
    }
    if (nowX < W - R - 60) svg += text(nowX + 26, 16, "FORECAST", caps);

    for (var g = 0; g <= top; g += step) {
      var gy = y(g / u.factor);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)"/>';
      svg += text(L - 8, gy + 4, g, 'text-anchor="end" font-size="12" fill="var(--muted)"');
    }
    svg += text(L - 8, T - 14, esc(unit), 'text-anchor="end" font-size="12" fill="var(--muted)"');

    // "now": dashed line with a small label
    svg += '<line x1="' + nowX.toFixed(1) + '" x2="' + nowX.toFixed(1) + '" y1="' + (T - 10) + '" y2="' + (H - B) +
      '" stroke="var(--fg)" stroke-width="1.4" stroke-dasharray="3 3"/>';
    svg += '<rect x="' + (nowX - 19).toFixed(1) + '" y="' + (T - 28) + '" width="38" height="18" rx="9" fill="var(--fg)"/>';
    svg += text(nowX, T - 15, "now", 'text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--bg)"');

    // Lines, day by day (nights are not forecast)
    var start = 0;
    days.forEach(function (d) {
      series.forEach(function (s) {
        var pts = [];
        d.hours.forEach(function (h, k) {
          if (isNum(h[s.key])) pts.push(x(start + k).toFixed(1) + "," + y(h[s.key]).toFixed(1));
        });
        if (pts.length) {
          svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + s.width +
            '" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") +
            ' points="' + pts.join(" ") + '"/>';
        }
      });
      d.hours.forEach(function (h, k) {
        var hour = parts(h.time).hour;
        if (hour % 6) return;
        var tx = x(start + k);
        svg += '<line x1="' + tx.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y1="' + (H - B) + '" y2="' + (H - B + 4) +
          '" stroke="var(--muted)"/>';
        svg += text(tx, H - B + 16, String(hour).padStart(2, "0"), 'text-anchor="middle" font-size="10.5" fill="var(--muted)"');
      });
      svg += text(d.mid, H - 8, dayLabel(d.date), 'text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--fg)"');
      start += d.hours.length + gap;
    });

    // Direct labels: the forecasts at their right end, the measurement above its highest point
    var labels = [];
    [HERO.openmeteo, HERO.model].forEach(function (s) {
      var last = null;
      points.forEach(function (p) { if (isNum(p.h[s.key])) last = p; });
      if (last) labels.push({ s: s, x: last.x, y: y(last.h[s.key]), ly: y(last.h[s.key]) + 4 });
    });
    labels.sort(function (a, b) { return a.ly - b.ly; });
    if (labels.length === 2 && labels[1].ly - labels[0].ly < 17) {
      var midY = (labels[0].ly + labels[1].ly) / 2;
      labels[0].ly = midY - 8.5; labels[1].ly = midY + 8.5;
    }
    labels.forEach(function (l) {
      svg += '<circle cx="' + l.x.toFixed(1) + '" cy="' + l.y.toFixed(1) + '" r="3.5" fill="' + l.s.color + '"/>';
      svg += text(l.x + 9, l.ly, l.s.label, 'font-size="13" font-weight="700" fill="' + l.s.color + '"');
    });
    var peak = null;
    points.forEach(function (p) {
      if (isNum(p.h.measured_speed) && (!peak || p.h.measured_speed > peak.h.measured_speed)) peak = p;
    });
    if (peak) {
      svg += text(peak.x, Math.max(T + 12, y(peak.h.measured_speed) - 10), HERO.measured.label,
        'text-anchor="middle" font-size="13" font-weight="700" fill="' + HERO.measured.color + '"');
    }
    return svg + "</svg>";
  }

  function errorBar(name, value, worst, color) {
    return "<span>" + name + '</span><span class="track"><i style="width:' + Math.round(100 * value / worst) +
      "%;background:" + color + '"></i></span><span class="val">' + (value * UNITS[unit].factor).toFixed(1) + " " +
      esc(unit) + "</span>";
  }

  function source(cls, s, title, textHtml) {
    return '<div class="source ' + cls + '"><h3>' + lineSample(s) + title + "</h3><p>" + textHtml + "</p></div>";
  }

  function hero(days, now) {
    var today = now.slice(0, 10);
    var hdays = heroDays(days, today);
    var measured = [];
    hdays.forEach(function (d) {
      d.hours.forEach(function (h) {
        if (h.time.slice(0, 13) < now.slice(0, 13) && isNum(h.measured_speed)) measured.push(h);
      });
    });
    var score = compare(measured, "model");
    var pastDays = hdays.filter(function (d) { return d.date < today; }).length;
    var caption = !measured.length ? "Earlier today" :
      (pastDays ? "Past " + pastDays + " day" + (pastDays > 1 ? "s" : "") : "Earlier today") + " · forecast vs. measured";

    var html = '<header class="hero"><div class="hero-top"><div>' +
      '<div class="brand">' + LOGO + "<h1>Windmojo <span>· " + esc(data.name) + "</span></h1></div>" +
      '<p class="tagline">Weather models forecast the wind for a whole region. <strong>Windmojo learns from ' +
      "years of measurements at one spot</strong> and turns the regional forecast into a forecast for exactly " +
      "this spot.</p></div>";
    if (score && score.n >= 6) {
      var worst = Math.max(score.om, score.model);
      var first = measured[0].time.slice(0, 10), last = measured[measured.length - 1].time.slice(0, 10);
      html += '<div class="score"><div class="score-big"><b>' + Math.abs(score.pct) + " %</b><span>" +
        (score.pct >= 0 ? "smaller" : "larger") + " error than<br>the weather model</span></div>" +
        '<div class="bars">' + errorBar("Weather model", score.om, worst, "var(--openmeteo)") +
        errorBar("Windmojo", score.model, worst, "var(--model)") + "</div>" +
        "<small>Mean error over " + score.n + " measured hours, " + dateRange(first, last) +
        "</small></div>";
    }
    html += "</div>" + '<div class="chart">' + heroChart(hdays, now, caption) + "</div>" +
      '<div class="sources">' +
      (measured.length ? source("measured", HERO.measured, "Measured",
        "Wind measured at the spot – the truth both forecasts are judged by.") : "") +
      source("openmeteo", HERO.openmeteo, "Weather model",
        "Regional forecast from Open-Meteo<sup>1</sup> for the area around the spot (10 m wind). It knows " +
        "nothing about the local effects of lake and terrain.") +
      source("model", HERO.model, "Windmojo",
        "Forecast for exactly this spot: machine learning, trained on years of local measurements, corrects " +
        "the weather model.") +
      "</div>" +
      '<p class="footnote"><sup>1</sup> <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a> is an ' +
      "open weather API that serves the forecast models of national weather services – among them GFS, the " +
      "global model of the US weather service NOAA, and ICON of the German weather service DWD. Windmojo uses " +
      "Open-Meteo’s “best match” blend at 9 grid points around the spot." +
      (pastDays ? " Past days show the forecast as shown then or, before the forecast archive started, a " +
        "hindcast by a model that had not seen these days." : "") + "</p></header>";
    return html;
  }

  function toolbar() {
    var html = '<div class="toolbar">' +
      '<button type="button" class="primary" id="wm-update"' + (busy ? " disabled" : "") + ">" +
      (busy ? "Updating … (up to a minute)" : "Update forecast" + (local.measurements_update ? " and measurements" : "")) +
      "</button>" +
      '<span class="muted">Measurements until ' + (local.measurements_until ? esc(timeLabel(local.measurements_until)) : "–") +
      "</span>" +
      '<span><a href="download/forecast.csv">Forecast as CSV</a> · ' +
      '<a href="download/history.csv?days=30">Look back 30 days as CSV</a></span></div>';
    if (messages.length) html += '<div class="meta">' + messages.map(esc).join(" ") + "</div>";
    return html;
  }

  // Time windows in which the Windmojo mean wind is in the session range, per forecast day
  function sessions(days, now) {
    var today = now.slice(0, 10), hourNow = parseInt(now.slice(11, 13), 10);
    var rows = days.filter(function (d) { return d.date >= today; }).slice(0, 3).map(function (d) {
      var hours = d.hours.filter(function (h) {
        var hour = parts(h.time).hour;
        return hour >= SESSION.fromHour && hour < SESSION.toHour && (d.date > today || hour >= hourNow) &&
          isNum(h.wind_speed);
      });
      if (!hours.length) return null;
      var windows = [], max = 0;
      hours.forEach(function (h) {
        var kn = h.wind_speed * KN, hour = parts(h.time).hour;
        max = Math.max(max, kn);
        if (kn < SESSION.minKn || kn > SESSION.maxKn) return;
        var last = windows[windows.length - 1];
        if (last && last[1] === hour) last[1] = hour + 1; else windows.push([hour, hour + 1]);
      });
      var label = d.date === today ? "Today" : dayLabel(d.date);
      var text = windows.length ?
        '<span class="good">' + windows.map(function (w) { return w[0] + "–" + w[1] + " h"; }).join(", ") +
          "</span>" :
        max > SESSION.maxKn ? "too strong (up to " + Math.round(max) + " kn)" :
        max >= SESSION.minKn - 1 ? "just below (max " + max.toFixed(1) + " kn)" :
        "not enough wind (max " + Math.round(max) + " kn)";
      return "<li>" + label + ": " + text + "</li>";
    }).filter(Boolean);
    if (!rows.length) return "";
    return '<div class="summary"><strong>' + esc(SESSION.name) + " (" + SESSION.minKn + "–" + SESSION.maxKn +
      " kn mean wind, " + SESSION.fromHour + "–" + SESSION.toHour + " h, Windmojo)</strong><ul>" +
      rows.join("") + "</ul></div>";
  }

  function history(today) {
    var days = past.filter(function (d) { return d.date < today; }).reverse();
    var html = '<div class="history"><h2>Look back</h2><div class="meta">Solid: forecast as shown then (fills ' +
      "up with every update). Dotted: what the model says afterwards with the weather data of the day. " +
      "Green: measured.</div>";
    if (!days.length) return html + '<p class="muted">No past days in the archive yet.</p></div>';
    days.forEach(function (d) {
      var then = compare(d.hours, "wind_speed"), later = compare(d.hours, "hindcast_speed");
      var info = d.forecast_generated_at ? "Forecast from " + esc(created(d.forecast_generated_at)) :
        "no archived forecast";
      if (then) info += "<br>As shown then: " + better(then);
      if (later) info += "<br>Hindcast: " + better(later) +
        (d.hindcast_in_training ? " – day was part of the model's training, so this is too good" : "");
      html += "<section><h3>" + dayLabel(d.date) + '</h3><div class="meta">' + info + "</div>" +
        legend(d.hours) + '<div class="chart">' + chart([d]) + "</div>" +
        "<details><summary>Hourly values</summary>" + table(d, "") + "</details></section>";
    });
    return html + "</div>";
  }

  function render() {
    var days = groupByDay(data.hours || []);
    var generated = new Date(data.generated_at);
    var ageHours = (Date.now() - generated.getTime()) / 36e5;
    var now = spotNow(data.timezone);
    var mae = data.model && data.model.test_mae;

    var html = hero(days, now);
    if (headerOnly) {
      root.innerHTML = html;
      return;
    }
    html += '<div class="meta">Updated: ' + esc(created(data.generated_at)) + " · Local time (" +
      esc(data.timezone) + ")" + (mae ? " · Model error in test ±" + fmt(mae) + " " + esc(unit) : "") + "</div>";
    if (local) html += toolbar();
    if (ageHours > STALE_HOURS) {
      html += '<div class="warn">This forecast is ' + Math.round(ageHours) + " hours old" +
        (local ? " – please update." : " and has not been updated.") + "</div>";
    }
    html += sessions(days, now);

    html += '<div class="controls" role="group" aria-label="Unit">' +
      Object.keys(UNITS).map(function (k) {
        return '<button type="button" data-unit="' + k + '" aria-pressed="' + (k === unit) + '">' + k + "</button>";
      }).join("") + "</div>";

    html += legend(data.hours || []);
    html += '<div class="chart">' + chart(days) + "</div>";
    html += days.map(function (d) {
      return '<section class="day"><h2>' + dayLabel(d.date) + "</h2>" + table(d, now) + "</section>";
    }).join("");
    if (local) html += history(now.slice(0, 10));
    html += '<footer>Wind in ' + esc(unit) + ", mean wind 10 m above ground. " +
      'Weather data: <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a> (CC BY 4.0). ' +
      'Forecast: <a href="https://github.com/marioland/windmojo" rel="noopener">Windmojo</a>.</footer>';

    root.innerHTML = html;
    Array.prototype.forEach.call(root.querySelectorAll("button[data-unit]"), function (b) {
      b.addEventListener("click", function () {
        unit = b.getAttribute("data-unit");
        try { localStorage.setItem("windmojo-unit", unit); } catch (e) {}
        render();
      });
    });
    var update = document.getElementById("wm-update");
    if (update) update.addEventListener("click", runUpdate);
  }

  function getJson(url, options) {
    return fetch(url, options).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok && r.status !== 409) throw new Error(body.message || "HTTP " + r.status);
        return body;
      });
    });
  }

  // Cache-busting per 10 minutes, so browsers and proxies don't serve old forecasts for long
  var src = root.getAttribute("data-src");
  function loadForecast() {
    var sep = src.indexOf("?") < 0 ? "?" : "&";
    return getJson(src + sep + "v=" + Math.floor(Date.now() / 6e5)).then(function (json) { data = json; });
  }

  // Only `cli.py serve` answers these; on a static website the page stays as it was
  function loadLocal() {
    return getJson("api/status").then(function (status) {
      local = status;
      return getJson("api/history?days=" + HISTORY_DAYS);
    }).then(function (json) { past = json.days || []; }).catch(function () { local = null; });
  }

  function runUpdate() {
    busy = true; messages = []; render();
    getJson("api/update", { method: "POST" })
      .then(function (result) { messages = result.messages || []; })
      .catch(function (err) { messages = ["Error: " + err.message]; })
      .then(function () { return Promise.all([loadForecast(), loadLocal()]); })
      .catch(function () {})
      .then(function () { busy = false; render(); });
  }

  loadForecast()
    .then(loadLocal)
    .then(render)
    .catch(function (err) {
      // No forecast yet: when served locally, offer the update button anyway
      loadLocal().then(function () {
        if (local) {
          data = { name: local.name, generated_at: new Date().toISOString(), timezone: "UTC", hours: [] };
          messages = ["No forecast yet – please update."];
          render();
        } else {
          root.innerHTML = '<p class="warn">Could not load the forecast (' + esc(err.message) + ").</p>";
        }
      });
    });
})();
</script>
</body>
</html>
